services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: campus-event-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: campus-event-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://campus-event-frontend.vercel.app
      - key: APP_NAME
        value: Campus Event Management System

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: campus-event-db
    plan: free
    databaseName: campus_events_db
    user: campus_user
